.star{animation:twinkle 7s ease-in-out infinite alternate}.star:nth-of-type(3n){animation-delay:-3s;animation-duration:9s}.star:nth-of-type(3n+1){animation-delay:-6s}
.glow{animation:breathe 10s ease-in-out infinite alternate}
.grid-travel{animation:travel 5s linear infinite;transform-origin:0 0}
@keyframes twinkle{from{opacity:.18}to{opacity:.65}}
@keyframes breathe{from{opacity:.45}to{opacity:1}}
@keyframes travel{from{transform:scaleY(1)}to{transform:scaleY(1.7)}}


/* Transparent gaps rise through the lower sun, thinning as they ascend.
   Their reset occurs beyond the disc or at zero thickness. */
.sun-gap{animation:sun-ripple 30s linear infinite;transform-origin:0 0}
@keyframes sun-ripple{
  0%{transform:translateY(224px) scaleY(1.2)}
  25%{transform:translateY(193px) scaleY(.86)}
  50%{transform:translateY(162px) scaleY(.53)}
  75%{transform:translateY(131px) scaleY(.23)}
  100%{transform:translateY(100px) scaleY(0)}
}
.sun-top{animation:sun-top-hue 24s ease-in-out infinite}
.sun-middle{animation:sun-middle-hue 24s ease-in-out infinite}
.sun-bottom{animation:sun-bottom-hue 24s ease-in-out infinite}
@keyframes sun-top-hue{0%,100%{stop-color:#ff1499}45%{stop-color:#ff626e}75%{stop-color:#ed36cc}}
@keyframes sun-middle-hue{0%,100%{stop-color:#f786db}45%{stop-color:#dba8ea}75%{stop-color:#b8a0f4}}
@keyframes sun-bottom-hue{0%,100%{stop-color:#63edfa}45%{stop-color:#9696ff}75%{stop-color:#79d8ff}}
@media(prefers-reduced-motion:reduce){.star,.glow,.grid-travel,.sun-gap,.sun-top,.sun-middle,.sun-bottom{animation:none}}
